<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="interactive-widget" content="resizes-content" />
<title>木桌手札 · Wooden Notebook</title>
<style>
  /* wooden-notebook-v2-real — whole-book frame, mobile fit, lined caret */
  :root {
    --desk-warm: #5c3a22;
    --leather: #4a1f1a;
    --leather-mid: #5c2822;
    --leather-deep: #2a100e;
    --leather-edge: #6b2e28;
    --gold: #c9a86a;
    --paper: #f3e6cc;
    --paper-deep: #e8d7b8;
    --paper-line: rgba(120, 90, 55, 0.28);
    --ink: #1f1812;
    --hint: #9a8a72;
    --ui: #f7efe3;
    --line-h: 28px;
    --ease: cubic-bezier(0.4, 0.0, 0.2, 1);
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --vv-h: 100dvh;
    --kb-pad: 0px;
    --toolbar-h: 56px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a100c;
    font-family: "Songti SC", "Noto Serif SC", "STSong", "SimSun", Georgia, "Times New Roman", serif;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  #scene {
    position: fixed; inset: 0;
    perspective: 1200px;
    perspective-origin: 50% 40%;
    overflow: hidden;
    background:
      radial-gradient(ellipse 90% 70% at 50% 28%, #3d2818 0%, #1a100c 68%, #0d0806 100%);
  }
  #scene::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 48% 36% at 55% 22%, rgba(255,210,140,0.16), transparent 62%),
      radial-gradient(ellipse 28% 22% at 28% 62%, rgba(180,100,40,0.08), transparent 55%);
    pointer-events: none;
    z-index: 1;
  }

  #world {
    position: absolute;
    left: 50%; top: 50%;
    width: 100vw; height: 100%;
    transform-style: preserve-3d;
    transform-origin: 50% 55%;
    transition: transform 1.25s var(--ease-out);
    will-change: transform;
  }

  body:not(.zoomed) #world {
    transform: translate(-50%, -48%) translateZ(0) rotateX(48deg) rotateZ(-6deg) scale(0.92);
  }
  body.zoomed:not(.open) #world {
    transform: translate(-50%, -52%) translateZ(380px) rotateX(4deg) scale(1.02);
  }
  /* Open: keep whole book in frame — milder dolly, slight top-down */
  body.zoomed.open #world {
    transform: translate(-50%, calc(-50% - var(--kb-pad) * 0.15)) translateZ(220px) rotateX(12deg) scale(0.98);
  }
  body.zoomed.open.kb-open #world {
    transform: translate(-50%, calc(-58% - var(--kb-pad) * 0.08)) translateZ(160px) rotateX(8deg) scale(0.9);
  }

  /* ========== DESK ========== */
  #desk {
    position: absolute;
    left: 50%; top: 52%;
    width: min(920px, 94vw);
    height: min(640px, 82vh);
    transform: translate(-50%, -50%) translateZ(-40px);
    transform-style: preserve-3d;
    border-radius: 4px;
    background:
      repeating-linear-gradient(92deg, transparent 0 2px, rgba(0,0,0,0.035) 2px 3px),
      repeating-linear-gradient(0deg, transparent 0 40px, rgba(255,220,160,0.035) 40px 41px),
      linear-gradient(135deg, #7a4e2e 0%, #5c3a22 35%, #6b4428 55%, #4a2e18 80%, #5e3c24 100%);
    box-shadow:
      0 40px 80px rgba(0,0,0,0.55),
      0 8px 20px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,220,160,0.18),
      inset 0 -8px 24px rgba(0,0,0,0.25);
    cursor: pointer;
  }
  #desk::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/%3E%3C/svg%3E");
    opacity: 0.28;
    mix-blend-mode: multiply;
    pointer-events: none;
  }
  #desk::after {
    content: "";
    position: absolute;
    left: 6%; right: 6%; bottom: -18px;
    height: 28px;
    background: linear-gradient(180deg, rgba(0,0,0,0.35), transparent);
    filter: blur(10px);
    border-radius: 50%;
    pointer-events: none;
  }

  /* ========== BOOK ========== */
  #book {
    position: absolute;
    left: 50%; top: 48%;
    width: min(260px, 54vw);
    height: min(360px, 54vh);
    transform: translate(-50%, -50%) translateZ(30px) rotateZ(8deg);
    transform-style: preserve-3d;
    cursor: pointer;
    transition: width 0.7s var(--ease-out), height 0.7s var(--ease-out), transform 0.7s var(--ease-out);
    z-index: 5;
  }
  body.zoomed #book {
    transform: translate(-50%, -50%) translateZ(30px) rotateZ(0deg);
  }

  /* Open book: whole object fits with desk margins; not fullscreen paper */
  body.open #book {
    width: min(640px, 86vw);
    height: min(420px, calc(100dvh - var(--toolbar-h) - env(safe-area-inset-bottom, 0px) - 72px));
    max-height: 62dvh;
    cursor: default;
    transform: translate(-50%, -50%) translateZ(40px) rotateZ(0deg);
  }

  .book-shadow {
    position: absolute;
    left: 4%; right: 4%; bottom: -14px;
    height: 32px;
    background: radial-gradient(ellipse, rgba(0,0,0,0.55), transparent 70%);
    filter: blur(10px);
    transform: translateZ(-2px);
    transition: all 0.8s var(--ease);
    pointer-events: none;
  }
  body.open .book-shadow {
    left: 1%; right: 1%; bottom: -20px; height: 42px; opacity: 0.75;
  }

  .book-block {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
  }

  /* Closed cover */
  .cover {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    transform-origin: left center;
    transition: transform 1s var(--ease-out), opacity 0.4s;
    z-index: 20;
    border-radius: 3px 7px 7px 3px;
    background:
      linear-gradient(105deg, rgba(255,220,160,0.1) 0%, transparent 42%),
      linear-gradient(180deg, #5a2822 0%, #3d1814 42%, #2e1210 100%);
    box-shadow:
      2px 0 0 var(--leather-edge),
      5px 0 0 rgba(0,0,0,0.22),
      10px 6px 22px rgba(0,0,0,0.42),
      inset 0 1px 0 rgba(255,220,160,0.14),
      inset -10px 0 18px rgba(0,0,0,0.28);
    backface-visibility: hidden;
  }
  .cover::before {
    content: "";
    position: absolute;
    left: 14px; top: 10%; bottom: 10%;
    width: 3px;
    background: linear-gradient(180deg, transparent, var(--gold), transparent);
    opacity: 0.55;
    border-radius: 2px;
  }
  .cover-title {
    position: absolute; left: 0; right: 0; top: 38%;
    text-align: center; color: var(--gold);
    font-size: clamp(15px, 3.2vw, 20px);
    letter-spacing: 0.35em; opacity: 0.88;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    pointer-events: none; padding-left: 0.35em;
  }
  .cover-subtitle {
    position: absolute; left: 0; right: 0; top: 48%;
    text-align: center; color: var(--gold);
    font-size: clamp(10px, 2vw, 12px);
    letter-spacing: 0.5em; opacity: 0.42;
    pointer-events: none; padding-left: 0.5em;
  }
  .cover-ornament {
    position: absolute; left: 50%; top: 28%;
    width: 48px; height: 1px; transform: translateX(-50%);
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.5; pointer-events: none;
  }
  .cover-ornament.bottom { top: auto; bottom: 28%; }

  .cover-inside {
    position: absolute; inset: 0;
    transform: rotateY(180deg);
    backface-visibility: hidden;
    border-radius: 7px 3px 3px 7px;
    /* marbled endpaper */
    background:
      radial-gradient(ellipse 40% 30% at 20% 30%, rgba(120,40,50,0.35), transparent 55%),
      radial-gradient(ellipse 35% 40% at 70% 60%, rgba(40,60,90,0.3), transparent 50%),
      radial-gradient(ellipse 50% 35% at 50% 80%, rgba(160,100,40,0.25), transparent 55%),
      radial-gradient(circle at 40% 40%, rgba(80,20,40,0.2) 0 1px, transparent 2px),
      linear-gradient(135deg, #c4a882 0%, #d8c09a 40%, #b8956e 100%);
    box-shadow: inset -4px 0 14px rgba(0,0,0,0.12);
  }

  body.open .cover {
    transform: rotateY(-155deg);
    pointer-events: none;
    opacity: 0;
  }

  .page-edge-closed {
    position: absolute;
    right: -11px; top: 5px; bottom: 5px;
    width: 13px;
    background: repeating-linear-gradient(180deg, #f0e6d0 0 1px, #e0d2b4 1px 2px, #d4c4a4 2px 3px);
    transform: translateZ(-2px);
    border-radius: 0 2px 2px 0;
    box-shadow: 2px 0 6px rgba(0,0,0,0.25);
    transition: opacity 0.45s;
  }
  body.open .page-edge-closed { opacity: 0; pointer-events: none; }

  .book-spine-closed {
    position: absolute;
    left: -8px; top: 2px; bottom: 2px;
    width: 10px;
    background: linear-gradient(90deg, #1a0a08, #3a1814 40%, #2a100e);
    transform: rotateY(-90deg);
    transform-origin: right center;
    border-radius: 2px 0 0 2px;
    box-shadow: -2px 0 8px rgba(0,0,0,0.3);
    transition: opacity 0.4s;
  }
  body.open .book-spine-closed { opacity: 0; }

  /* ========== OPEN SHELL (physical hardcover) ========== */
  #open-shell {
    position: absolute; inset: 0;
    display: none;
    transform-style: preserve-3d;
    opacity: 0;
    transition: opacity 0.45s ease 0.28s;
    pointer-events: none;
  }
  body.open #open-shell {
    display: flex;
    opacity: 1;
    pointer-events: auto;
  }

  .shell-inner {
    position: relative;
    width: 100%; height: 100%;
    display: grid;
    grid-template-columns: 11% 1fr 14px;
    gap: 0;
    padding: 10px 12px 12px 10px;
    border-radius: 6px 8px 8px 6px;
    background:
      linear-gradient(105deg, rgba(255,220,160,0.07), transparent 40%),
      linear-gradient(180deg, #5a2822 0%, #3a1612 45%, #24100e 100%);
    box-shadow:
      0 18px 40px rgba(0,0,0,0.5),
      0 4px 12px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,220,160,0.12),
      inset 0 -2px 0 rgba(0,0,0,0.35),
      inset 2px 2px 0 rgba(0,0,0,0.15);
    overflow: visible;
  }

  /* worn leather grain overlay */
  .shell-inner::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.45'/%3E%3C/svg%3E");
    opacity: 0.22;
    mix-blend-mode: multiply;
    pointer-events: none;
    z-index: 1;
  }

  /* gold fillet on shell rim */
  .shell-inner::after {
    content: "";
    position: absolute;
    inset: 5px;
    border-radius: 3px;
    border: 1px solid rgba(201,168,106,0.22);
    pointer-events: none;
    z-index: 2;
  }

  /* Left cover board (endpaper face) */
  .left-board {
    position: relative;
    z-index: 3;
    margin: 2px 4px 2px 2px;
    border-radius: 3px 0 0 3px;
    background:
      radial-gradient(ellipse 55% 40% at 30% 25%, rgba(110,35,45,0.4), transparent 60%),
      radial-gradient(ellipse 40% 50% at 75% 70%, rgba(35,55,85,0.35), transparent 55%),
      radial-gradient(ellipse 60% 30% at 40% 90%, rgba(150,90,35,0.28), transparent 50%),
      linear-gradient(160deg, #c9ad88, #d6c09a 45%, #b89268);
    box-shadow:
      inset -6px 0 14px rgba(40,20,10,0.25),
      inset 0 0 0 1px rgba(80,50,30,0.15);
    transform: perspective(800px) rotateY(8deg);
    transform-origin: right center;
  }
  .left-board::after {
    content: "手札";
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%) rotate(-90deg);
    font-size: 11px;
    letter-spacing: 0.4em;
    color: rgba(90,50,30,0.28);
    white-space: nowrap;
    pointer-events: none;
  }

  /* Paper well (pages inset in leather) */
  .paper-well {
    position: relative;
    z-index: 4;
    margin: 2px 0;
    border-radius: 2px;
    background: var(--paper);
    box-shadow:
      inset 0 0 0 1px rgba(160,130,90,0.25),
      0 1px 0 rgba(255,255,240,0.35),
      inset 8px 0 18px rgba(80,50,20,0.12);
    display: flex;
    overflow: hidden;
    min-width: 0;
  }

  /* fiber / aged paper texture */
  .paper-well::before {
    content: "";
    position: absolute; inset: 0;
    background:
      url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E"),
      linear-gradient(90deg, rgba(120,80,40,0.06), transparent 8%, transparent 92%, rgba(120,80,40,0.05));
    opacity: 0.18;
    mix-blend-mode: multiply;
    pointer-events: none;
    z-index: 1;
  }

  /* slight outer corner lift / curl */
  .paper-well::after {
    content: "";
    position: absolute;
    right: 0; bottom: 0;
    width: 28%; height: 22%;
    background: linear-gradient(225deg, transparent 40%, rgba(0,0,0,0.04) 70%, rgba(0,0,0,0.07));
    border-radius: 0 0 2px 0;
    pointer-events: none;
    z-index: 2;
  }

  /* Stacked page edges on right of shell */
  .edge-stack {
    position: relative;
    z-index: 3;
    margin: 4px 2px 4px 0;
    border-radius: 0 3px 3px 0;
    background: repeating-linear-gradient(
      180deg,
      #f2e8d2 0px, #e9dcc0 1px, #d9c9a8 2px, #efe3c8 3px
    );
    box-shadow:
      2px 0 4px rgba(0,0,0,0.2),
      inset 1px 0 0 rgba(255,255,240,0.35);
  }
  .edge-stack::before {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(80,50,20,0.18), transparent 60%);
    pointer-events: none;
  }

  /* Bookmark ribbon */
  .ribbon {
    position: absolute;
    top: -6px; right: 22%;
    width: 10px; height: 38%;
    z-index: 8;
    background: linear-gradient(180deg, #8b1e1e 0%, #a52828 40%, #6e1515 100%);
    box-shadow: 1px 2px 4px rgba(0,0,0,0.3);
    clip-path: polygon(0 0, 100% 0, 100% 92%, 50% 100%, 0 92%);
    pointer-events: none;
    opacity: 0.9;
  }

  .spread {
    position: relative;
    display: flex;
    width: 100%; height: 100%;
    z-index: 3;
    min-width: 0;
  }

  /* Deep binding gutter + stitch hints */
  .gutter {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 22px;
    z-index: 5;
    pointer-events: none;
    background: linear-gradient(90deg,
      rgba(40,20,10,0.22) 0%,
      rgba(60,35,15,0.12) 45%,
      transparent 100%);
  }
  .gutter::before {
    content: "";
    position: absolute;
    left: 7px; top: 12%; bottom: 12%;
    width: 2px;
    background: repeating-linear-gradient(
      180deg,
      transparent 0 10px,
      rgba(90,60,35,0.35) 10px 12px,
      transparent 12px 22px
    );
  }

  .page {
    flex: 1;
    position: relative;
    min-width: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 14px 14px 22px 18px;
    z-index: 3;
  }
  .page.left { display: none; } /* desktop spread enables */

  .page-num {
    position: absolute;
    bottom: 6px; right: 12px;
    font-size: 10px;
    color: var(--hint);
    letter-spacing: 0.08em;
    pointer-events: none;
    user-select: none;
    z-index: 4;
  }

  .page-body {
    flex: 1;
    outline: none;
    overflow-y: auto;
    overflow-x: hidden;
    font-size: 16px; /* ≥16px prevents iOS focus-zoom */
    line-height: var(--line-h);
    color: var(--ink);
    caret-color: #1a0f08;
    word-break: break-word;
    -webkit-overflow-scrolling: touch;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent calc(var(--line-h) - 1px),
      var(--paper-line) calc(var(--line-h) - 1px),
      var(--paper-line) var(--line-h)
    );
    background-attachment: local;
    background-position: 0 0;
    padding: 0 2px;
    min-height: 80px;
    position: relative;
    z-index: 3;
    -webkit-user-select: text;
    user-select: text;
  }

  /* Placeholder only when truly empty — absolute so it doesn't shift caret */
  .page-body.is-empty::before {
    content: attr(data-placeholder);
    position: absolute;
    left: 2px; top: 0;
    color: var(--hint);
    font-style: italic;
    opacity: 0.55;
    pointer-events: none;
    line-height: var(--line-h);
    font-size: 16px;
  }

  .page-body ::selection {
    background: rgba(201, 168, 106, 0.4);
  }

  .img-wrap {
    position: relative;
    display: block;
    margin: calc(var(--line-h) * 0.35) auto;
    max-width: 92%;
    width: fit-content;
  }
  .img-wrap img {
    display: block;
    max-width: min(100%, 360px);
    height: auto;
    border-radius: 2px;
    box-shadow: 0 2px 10px rgba(60,40,20,0.2);
  }
  .img-wrap .img-del {
    position: absolute;
    top: -8px; right: -8px;
    width: 22px; height: 22px;
    border-radius: 50%;
    border: none;
    background: rgba(60, 30, 20, 0.85);
    color: #f4ead5;
    font-size: 14px;
    line-height: 22px;
    text-align: center;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s;
    padding: 0;
    font-family: system-ui, sans-serif;
  }
  .img-wrap:hover .img-del,
  .img-wrap:focus-within .img-del { opacity: 1; }

  .page.drag-over .page-body {
    outline: 2px dashed rgba(201,168,106,0.6);
    outline-offset: -4px;
    background-color: rgba(201,168,106,0.08);
  }

  /* ========== TOOLBAR ========== */
  #toolbar {
    position: fixed;
    left: 50%;
    bottom: max(12px, env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(140%);
    display: flex;
    gap: 4px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    padding: 7px 10px;
    max-width: calc(100vw - 16px);
    background: rgba(42, 28, 20, 0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.4);
    z-index: 100;
    transition: transform 0.45s var(--ease-out) 0.15s, bottom 0.2s;
    border: 1px solid rgba(201,168,106,0.2);
  }
  body.open #toolbar { transform: translateX(-50%) translateY(0); }
  body.open.kb-open #toolbar {
    bottom: max(8px, calc(100dvh - var(--vv-h) + 8px));
  }

  #toolbar button {
    appearance: none; border: none; background: transparent;
    color: var(--ui);
    font-family: "Songti SC", "Noto Serif SC", Georgia, serif;
    font-size: 12px;
    padding: 7px 9px;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 0.05em;
    white-space: nowrap;
  }
  #toolbar button:hover, #toolbar button:focus-visible {
    background: rgba(201,168,106,0.22); outline: none;
  }
  #toolbar button:disabled { opacity: 0.35; cursor: default; }
  #toolbar .sep {
    width: 1px; height: 16px;
    background: rgba(201,168,106,0.25);
  }
  #page-indicator {
    color: rgba(247,239,227,0.7);
    font-size: 11px;
    letter-spacing: 0.06em;
    min-width: 3.8em;
    text-align: center;
    font-variant-numeric: tabular-nums;
    user-select: none;
  }

  #hint-toast {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    background: rgba(42,28,20,0.82);
    color: var(--ui);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 12px;
    letter-spacing: 0.06em;
    z-index: 90;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.45s;
    border: 1px solid rgba(201,168,106,0.2);
  }
  #hint-toast.show { opacity: 1; }

  /* Desktop / wide: two-page spread inside shell */
  @media (min-width: 700px) {
    body.open #book {
      width: min(720px, 78vw);
      height: min(460px, 64dvh);
    }
    .shell-inner {
      grid-template-columns: 10% 1fr 16px;
      padding: 12px 14px 14px 12px;
    }
    .page.left {
      display: flex;
      border-right: none;
      padding-right: 16px;
      padding-left: 22px;
    }
    .page.right {
      padding-left: 16px;
      padding-right: 16px;
    }
    .gutter {
      left: 50%;
      width: 36px;
      transform: translateX(-50%);
      background: linear-gradient(90deg,
        transparent,
        rgba(80,50,20,0.1) 25%,
        rgba(40,20,10,0.22) 50%,
        rgba(80,50,20,0.1) 75%,
        transparent);
    }
    .gutter::before {
      left: 50%;
      transform: translateX(-50%);
    }
    .page.left .page-num { left: 14px; right: auto; }
  }

  /* Phones: compact whole book with desk margins */
  @media (max-width: 699px) {
    body.open #book {
      width: min(92vw, 360px);
      height: min(58dvh, calc(100dvh - var(--toolbar-h) - env(safe-area-inset-bottom, 0px) - 88px));
      max-height: 420px;
    }
    body.zoomed.open #world {
      transform: translate(-50%, calc(-48% - var(--kb-pad) * 0.12)) translateZ(140px) rotateX(14deg) scale(0.95);
    }
    .shell-inner {
      grid-template-columns: 13% 1fr 12px;
      padding: 8px 9px 10px 8px;
    }
    .page { padding: 12px 12px 20px 16px; }
    .left-board::after { font-size: 9px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #world, #book, .cover, #toolbar, #open-shell { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div id="scene">
  <div id="world">
    <div id="desk" title="点击桌面放下书"></div>
    <div id="book" role="button" aria-label="手札">
      <div class="book-shadow"></div>
      <div class="book-spine-closed"></div>
      <div class="page-edge-closed"></div>
      <div class="book-block">
        <div class="cover">
          <div class="cover-ornament"></div>
          <div class="cover-title">手 札</div>
          <div class="cover-subtitle">NOTEBOOK</div>
          <div class="cover-ornament bottom"></div>
          <div class="cover-inside"></div>
        </div>
        <div id="open-shell">
          <div class="ribbon" aria-hidden="true"></div>
          <div class="shell-inner">
            <div class="left-board" aria-hidden="true"></div>
            <div class="paper-well">
              <div class="gutter" aria-hidden="true"></div>
              <div class="spread">
                <div class="page left" data-side="left">
                  <div class="page-body" contenteditable="true" spellcheck="false" data-placeholder="点这里开始写…"></div>
                  <div class="page-num"></div>
                </div>
                <div class="page right" data-side="right">
                  <div class="page-body" contenteditable="true" spellcheck="false" data-placeholder="点这里开始写…"></div>
                  <div class="page-num"></div>
                </div>
              </div>
            </div>
            <div class="edge-stack" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="hint-toast"></div>

<div id="toolbar" role="toolbar" aria-label="手札工具">
  <button type="button" id="btn-prev" title="上一页">‹ 上一页</button>
  <span id="page-indicator">1 / 1</span>
  <button type="button" id="btn-next" title="下一页">下一页 ›</button>
  <span class="sep"></span>
  <button type="button" id="btn-new" title="新建一页">新建一页</button>
  <button type="button" id="btn-img" title="插入图片">插入图片</button>
  <span class="sep"></span>
  <button type="button" id="btn-close" title="合上书">合上书</button>
  <button type="button" id="btn-desk" title="放下">放下</button>
</div>

<input type="file" id="file-input" accept="image/*" multiple hidden />

<script>
(function () {
  "use strict";

  const STORAGE_KEY = "wooden-notebook-v1";
  const MAX_IMG_EDGE = 1200;
  const JPEG_QUALITY = 0.82;

  const body = document.body;
  const book = document.getElementById("book");
  const desk = document.getElementById("desk");
  const toast = document.getElementById("hint-toast");
  const fileInput = document.getElementById("file-input");
  const pageIndicator = document.getElementById("page-indicator");
  const leftPage = document.querySelector(".page.left");
  const rightPage = document.querySelector(".page.right");
  const leftBody = leftPage.querySelector(".page-body");
  const rightBody = rightPage.querySelector(".page-body");
  const leftNum = leftPage.querySelector(".page-num");
  const rightNum = rightPage.querySelector(".page-num");
  const root = document.documentElement;

  let pages = [{ html: "" }, { html: "" }];
  let spreadIndex = 0;
  let animating = false;
  let state = "desk";
  let saveTimer = null;
  let activeSide = "right";
  let toastTimer = null;
  let lastVvHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;

  function isMobile() {
    return window.matchMedia("(max-width: 699px)").matches;
  }

  function showToast(msg, ms) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, ms || 2400);
  }

  function stripScripts(html) {
    var d = document.createElement("div");
    d.innerHTML = html;
    d.querySelectorAll("script, iframe, object, embed, link[rel=import]").forEach(function (el) { el.remove(); });
    d.querySelectorAll("*").forEach(function (el) {
      Array.from(el.attributes).forEach(function (attr) {
        if (/^on/i.test(attr.name)) el.removeAttribute(attr.name);
        if ((attr.name === "href" || attr.name === "src") && /^\s*javascript:/i.test(attr.value)) {
          el.removeAttribute(attr.name);
        }
      });
    });
    return d.innerHTML;
  }

  function isBodyEmpty(el) {
    var t = (el.textContent || "").replace(/\u200b/g, "").trim();
    if (t.length) return false;
    if (el.querySelector("img, .img-wrap")) return false;
    return true;
  }

  function updateEmptyClass(el) {
    if (isBodyEmpty(el)) el.classList.add("is-empty");
    else el.classList.remove("is-empty");
  }

  function ensurePages() {
    while (pages.length < 2) pages.push({ html: "" });
    if (pages.length % 2 === 1) pages.push({ html: "" });
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (data && Array.isArray(data.pages) && data.pages.length) {
        pages = data.pages.map(function (p) {
          return { html: stripScripts(typeof p === "string" ? p : (p.html || "")) };
        });
        spreadIndex = Math.max(0, Math.min(data.spreadIndex || 0, pages.length - 1));
        if (spreadIndex % 2 === 1) spreadIndex -= 1;
      }
    } catch (e) { console.warn("load failed", e); }
    ensurePages();
  }

  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, 280);
  }

  function persist() {
    syncFromDOM();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        pages: pages.map(function (p) { return { html: stripScripts(p.html) }; }),
        spreadIndex: spreadIndex,
        savedAt: Date.now()
      }));
    } catch (e) {
      showToast("存储空间不足，部分内容可能未保存");
    }
  }

  function syncFromDOM() {
    ensurePages();
    if (isMobile()) {
      if (spreadIndex < pages.length) pages[spreadIndex].html = stripScripts(rightBody.innerHTML);
    } else {
      if (spreadIndex < pages.length) pages[spreadIndex].html = stripScripts(leftBody.innerHTML);
      if (spreadIndex + 1 < pages.length) pages[spreadIndex + 1].html = stripScripts(rightBody.innerHTML);
    }
  }

  function renderSpread() {
    ensurePages();
    var mobile = isMobile();
    if (mobile) {
      leftPage.style.display = "none";
      var idx = spreadIndex;
      rightBody.innerHTML = pages[idx] ? pages[idx].html : "";
      rightNum.textContent = String(idx + 1);
      leftBody.innerHTML = "";
      bindImageDeletes(rightBody);
      updateEmptyClass(rightBody);
      pageIndicator.textContent = (idx + 1) + " / " + pages.length;
    } else {
      leftPage.style.display = "";
      var li = spreadIndex;
      var ri = spreadIndex + 1;
      leftBody.innerHTML = pages[li] ? pages[li].html : "";
      rightBody.innerHTML = pages[ri] ? pages[ri].html : "";
      leftNum.textContent = String(li + 1);
      rightNum.textContent = String(ri + 1);
      bindImageDeletes(leftBody);
      bindImageDeletes(rightBody);
      updateEmptyClass(leftBody);
      updateEmptyClass(rightBody);
      pageIndicator.textContent = (li + 1) + "–" + (ri + 1) + " / " + pages.length;
    }
    document.getElementById("btn-prev").disabled = spreadIndex <= 0;
    document.getElementById("btn-next").disabled = false;
  }

  function bindImageDeletes(container) {
    container.querySelectorAll(".img-wrap").forEach(function (wrap) {
      var btn = wrap.querySelector(".img-del");
      if (!btn) {
        btn = document.createElement("button");
        btn.type = "button";
        btn.className = "img-del";
        btn.setAttribute("aria-label", "删除图片");
        btn.textContent = "×";
        wrap.appendChild(btn);
      }
      btn.onclick = function (e) {
        e.preventDefault();
        e.stopPropagation();
        wrap.remove();
        updateEmptyClass(container);
        scheduleSave();
      };
    });
  }

  function goPrev() {
    if (animating || state !== "open") return;
    syncFromDOM();
    if (spreadIndex <= 0) return;
    if (isMobile()) spreadIndex -= 1;
    else spreadIndex = Math.max(0, spreadIndex - 2);
    renderSpread();
    scheduleSave();
  }

  function goNext() {
    if (animating || state !== "open") return;
    syncFromDOM();
    if (isMobile()) {
      if (spreadIndex >= pages.length - 1) pages.push({ html: "" });
      spreadIndex += 1;
    } else {
      if (spreadIndex + 2 >= pages.length) pages.push({ html: "" }, { html: "" });
      spreadIndex += 2;
    }
    renderSpread();
    scheduleSave();
  }

  function newPage() {
    if (state !== "open") return;
    syncFromDOM();
    if (isMobile()) {
      pages.splice(spreadIndex + 1, 0, { html: "" });
      spreadIndex += 1;
    } else {
      var insertAt = spreadIndex + 2;
      pages.splice(insertAt, 0, { html: "" }, { html: "" });
      spreadIndex = insertAt;
    }
    ensurePages();
    renderSpread();
    scheduleSave();
    showToast("已新建一页");
    setTimeout(function () { (isMobile() ? rightBody : leftBody).focus(); }, 50);
  }

  function zoomIn() {
    if (animating || state !== "desk") return;
    animating = true;
    state = "zoomed";
    body.classList.add("zoomed");
    showToast("再点一下打开手札");
    setTimeout(function () { animating = false; }, 1300);
  }

  function openBook() {
    if (animating || state !== "zoomed") return;
    animating = true;
    state = "open";
    body.classList.add("open");
    renderSpread();
    setTimeout(function () {
      animating = false;
      showToast("可以开始书写了");
    }, 1000);
  }

  function closeBook(thenDesk) {
    if (animating || state === "desk") return;
    syncFromDOM();
    persist();
    animating = true;
    body.classList.remove("kb-open");
    root.style.setProperty("--kb-pad", "0px");
    if (state === "open") {
      body.classList.remove("open");
      state = "zoomed";
      setTimeout(function () {
        if (thenDesk) {
          body.classList.remove("zoomed");
          state = "desk";
          setTimeout(function () { animating = false; }, 1250);
        } else animating = false;
      }, 900);
    } else if (state === "zoomed") {
      body.classList.remove("zoomed");
      state = "desk";
      setTimeout(function () { animating = false; }, 1250);
    }
  }

  function putDown() { closeBook(true); }

  function compressImage(file) {
    return new Promise(function (resolve, reject) {
      if (!file || !/^image\//.test(file.type)) { reject(new Error("not image")); return; }
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        var w = img.naturalWidth, h = img.naturalHeight, scale = 1;
        if (Math.max(w, h) > MAX_IMG_EDGE) scale = MAX_IMG_EDGE / Math.max(w, h);
        var cw = Math.round(w * scale), ch = Math.round(h * scale);
        var canvas = document.createElement("canvas");
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext("2d");
        ctx.fillStyle = "#f3e6cc";
        ctx.fillRect(0, 0, cw, ch);
        ctx.drawImage(img, 0, 0, cw, ch);
        try { resolve(canvas.toDataURL("image/jpeg", JPEG_QUALITY)); }
        catch (e) { reject(e); }
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("load fail")); };
      img.src = url;
    });
  }

  function insertDataUrl(dataUrl, targetBody) {
    var wrap = document.createElement("div");
    wrap.className = "img-wrap";
    wrap.contentEditable = "false";
    var img = document.createElement("img");
    img.src = dataUrl; img.alt = "插图";
    var btn = document.createElement("button");
    btn.type = "button"; btn.className = "img-del";
    btn.setAttribute("aria-label", "删除图片");
    btn.textContent = "×";
    btn.onclick = function (e) {
      e.preventDefault(); e.stopPropagation();
      wrap.remove(); updateEmptyClass(targetBody); scheduleSave();
    };
    wrap.appendChild(img); wrap.appendChild(btn);
    var sel = window.getSelection();
    var inserted = false;
    if (sel && sel.rangeCount && targetBody.contains(sel.anchorNode)) {
      try {
        var range = sel.getRangeAt(0);
        range.collapse(false);
        range.insertNode(wrap);
        var br = document.createElement("br");
        wrap.after(br);
        range.setStartAfter(br); range.collapse(true);
        sel.removeAllRanges(); sel.addRange(range);
        inserted = true;
      } catch (e) {}
    }
    if (!inserted) {
      targetBody.appendChild(wrap);
      targetBody.appendChild(document.createElement("br"));
    }
    updateEmptyClass(targetBody);
    scheduleSave();
  }

  async function handleFiles(fileList, targetBody) {
    var files = Array.from(fileList || []);
    for (var i = 0; i < files.length; i++) {
      try { insertDataUrl(await compressImage(files[i]), targetBody); }
      catch (e) { showToast("图片处理失败"); }
    }
  }

  function getActiveBody() {
    if (isMobile()) return rightBody;
    return activeSide === "left" ? leftBody : rightBody;
  }

  /* ---- Caret / keyboard ---- */
  function scrollCaretIntoView() {
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    var range = sel.getRangeAt(0);
    var node = sel.focusNode;
    var inPage = node && (leftBody.contains(node) || rightBody.contains(node));
    if (!inPage) return;
    try {
      var rect = range.getBoundingClientRect();
      if (!rect || (rect.width === 0 && rect.height === 0 && rect.top === 0)) {
        var el = node.nodeType === 1 ? node : node.parentElement;
        if (el && el.scrollIntoView) el.scrollIntoView({ block: "nearest", inline: "nearest" });
        return;
      }
      var vv = window.visualViewport;
      var top = vv ? vv.offsetTop : 0;
      var bottom = vv ? vv.offsetTop + vv.height : window.innerHeight;
      var toolbar = document.getElementById("toolbar");
      var toolH = (state === "open" && toolbar) ? toolbar.getBoundingClientRect().height + 12 : 12;
      var safeBottom = bottom - toolH;
      if (rect.bottom > safeBottom - 8 || rect.top < top + 8) {
        range.startContainer.parentElement &&
          range.startContainer.parentElement.scrollIntoView({ block: "center", inline: "nearest" });
        // also nudge the page-body scroll
        var bodyEl = leftBody.contains(node) ? leftBody : rightBody;
        var br = bodyEl.getBoundingClientRect();
        var mid = (rect.top + rect.bottom) / 2;
        var target = br.top + br.height * 0.4;
        bodyEl.scrollTop += (mid - target);
      }
    } catch (e) {}
  }

  function onViewportChange() {
    var vv = window.visualViewport;
    if (!vv) return;
    root.style.setProperty("--vv-h", vv.height + "px");
    var overlap = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    root.style.setProperty("--kb-pad", overlap + "px");
    var kb = overlap > 120;
    body.classList.toggle("kb-open", kb && state === "open");
    if (kb && Math.abs(vv.height - lastVvHeight) > 2) {
      requestAnimationFrame(scrollCaretIntoView);
    }
    lastVvHeight = vv.height;
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", onViewportChange);
    window.visualViewport.addEventListener("scroll", function () {
      root.style.setProperty("--vv-h", window.visualViewport.height + "px");
    });
  }

  document.addEventListener("selectionchange", function () {
    if (state !== "open") return;
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    var n = sel.focusNode;
    if (n && (leftBody.contains(n) || rightBody.contains(n))) {
      requestAnimationFrame(scrollCaretIntoView);
    }
  });

  book.addEventListener("click", function (e) {
    if (state === "open") return;
    e.stopPropagation();
    if (state === "desk") zoomIn();
    else if (state === "zoomed") openBook();
  });

  desk.addEventListener("click", function (e) {
    if (state === "desk") return;
    e.stopPropagation();
    if (state === "open" || state === "zoomed") putDown();
  });

  document.getElementById("toolbar").addEventListener("click", function (e) { e.stopPropagation(); });

  leftBody.addEventListener("focus", function () { activeSide = "left"; setTimeout(scrollCaretIntoView, 280); });
  rightBody.addEventListener("focus", function () { activeSide = "right"; setTimeout(scrollCaretIntoView, 280); });

  [leftBody, rightBody].forEach(function (el) {
    el.addEventListener("input", function () {
      updateEmptyClass(el);
      scheduleSave();
      requestAnimationFrame(scrollCaretIntoView);
    });
    el.addEventListener("blur", scheduleSave);
    el.addEventListener("keyup", function () { requestAnimationFrame(scrollCaretIntoView); });
    el.addEventListener("click", function () { requestAnimationFrame(scrollCaretIntoView); });
    el.addEventListener("dragover", function (e) {
      e.preventDefault();
      el.closest(".page").classList.add("drag-over");
    });
    el.addEventListener("dragleave", function () {
      el.closest(".page").classList.remove("drag-over");
    });
    el.addEventListener("drop", function (e) {
      e.preventDefault(); e.stopPropagation();
      el.closest(".page").classList.remove("drag-over");
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
        handleFiles(e.dataTransfer.files, el);
      }
    });
  });

  var touchStartX = 0, touchStartY = 0;
  document.getElementById("open-shell").addEventListener("touchstart", function (e) {
    if (!e.touches[0]) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  document.getElementById("open-shell").addEventListener("touchend", function (e) {
    if (!e.changedTouches[0] || state !== "open") return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    var dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
    // ignore swipe that started inside contenteditable (likely selecting)
    var t = e.target;
    if (t && (t.isContentEditable || (t.closest && t.closest("[contenteditable]")))) return;
    if (dx < 0) goNext(); else goPrev();
  }, { passive: true });

  document.getElementById("btn-prev").addEventListener("click", goPrev);
  document.getElementById("btn-next").addEventListener("click", goNext);
  document.getElementById("btn-new").addEventListener("click", newPage);
  document.getElementById("btn-close").addEventListener("click", function () { closeBook(false); });
  document.getElementById("btn-desk").addEventListener("click", putDown);
  document.getElementById("btn-img").addEventListener("click", function () {
    if (state !== "open") return;
    fileInput.click();
  });
  fileInput.addEventListener("change", function () {
    handleFiles(fileInput.files, getActiveBody()).then(function () { fileInput.value = ""; });
  });

  document.addEventListener("keydown", function (e) {
    if (state !== "open") return;
    if (e.target && (e.target.isContentEditable || (e.target.closest && e.target.closest("[contenteditable]")))) {
      if (e.key === "Escape") { e.preventDefault(); closeBook(false); }
      return;
    }
    if (e.key === "ArrowLeft") goPrev();
    if (e.key === "ArrowRight") goNext();
    if (e.key === "Escape") closeBook(false);
  });

  window.addEventListener("resize", function () {
    if (state === "open") { syncFromDOM(); renderSpread(); }
    onViewportChange();
  });
  window.addEventListener("beforeunload", function () { syncFromDOM(); persist(); });

  load();
  onViewportChange();
  showToast("点击桌上的书靠近", 3200);

  window.__notebook = {
    persist: persist,
    pages: function () { return pages; },
    state: function () { return state; },
    marker: "wooden-notebook-v2-real"
  };
})();
</script>
</body>
</html>
