<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>木桌手札 · Wooden Notebook</title>
<style>
  :root {
    --desk-warm: #5c3a22;
    --leather: #4a1f1a;
    --leather-deep: #2e1210;
    --leather-edge: #6b2e28;
    --gold: #c9a86a;
    --paper: #f4ead5;
    --paper-line: rgba(140, 110, 70, 0.12);
    --ink: #2a2118;
    --hint: #9a8a72;
    --ui: #f7efe3;
    --shadow: rgba(20, 10, 5, 0.55);
    --ease: cubic-bezier(0.4, 0.0, 0.2, 1);
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a100c;
    font-family: "Songti SC", "Noto Serif SC", "STSong", "SimSun", Georgia, "Times New Roman", serif;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  /* ========== SCENE ========== */
  #scene {
    position: fixed; inset: 0;
    perspective: 1400px;
    perspective-origin: 50% 42%;
    overflow: hidden;
    background:
      radial-gradient(ellipse 90% 70% at 50% 30%, #3d2818 0%, #1a100c 70%, #0d0806 100%);
  }

  #scene::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 50% 40% at 55% 25%, rgba(255, 210, 140, 0.14), transparent 60%),
      radial-gradient(ellipse 30% 25% at 30% 60%, rgba(180, 100, 40, 0.08), transparent 50%);
    pointer-events: none;
    z-index: 1;
  }

  #world {
    position: absolute;
    left: 50%; top: 50%;
    width: 100vw; height: 100vh;
    transform-style: preserve-3d;
    transform-origin: 50% 55%;
    transition: transform 1.25s var(--ease-out);
    will-change: transform;
  }

  /* Camera states via body classes */
  body.zoomed #world {
    transform: translate(-50%, -52%) translateZ(420px) rotateX(2deg) scale(1.05);
  }
  body:not(.zoomed) #world {
    transform: translate(-50%, -48%) translateZ(0) rotateX(48deg) rotateZ(-6deg) scale(0.92);
  }
  body.zoomed.open #world {
    transform: translate(-50%, -50%) translateZ(480px) rotateX(0deg) scale(1.08);
  }

  /* ========== DESK ========== */
  #desk {
    position: absolute;
    left: 50%; top: 52%;
    width: min(920px, 92vw);
    height: min(620px, 78vh);
    transform: translate(-50%, -50%) translateZ(-40px);
    transform-style: preserve-3d;
    border-radius: 4px;
    background:
      repeating-linear-gradient(
        92deg,
        transparent 0px, transparent 2px,
        rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 3px
      ),
      repeating-linear-gradient(
        0deg,
        transparent 0px, transparent 40px,
        rgba(255,220,160,0.03) 40px, rgba(255,220,160,0.03) 41px
      ),
      linear-gradient(135deg, #7a4e2e 0%, #5c3a22 35%, #6b4428 55%, #4a2e18 80%, #5e3c24 100%);
    box-shadow:
      0 40px 80px rgba(0,0,0,0.55),
      0 8px 20px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,220,160,0.18),
      inset 0 -8px 24px rgba(0,0,0,0.25);
    cursor: pointer;
  }

  #desk::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    background:
      url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/%3E%3C/svg%3E");
    opacity: 0.28;
    mix-blend-mode: multiply;
    pointer-events: none;
  }

  #desk::after {
    content: "";
    position: absolute;
    left: 6%; right: 6%; bottom: -18px;
    height: 28px;
    background: linear-gradient(180deg, rgba(0,0,0,0.35), transparent);
    filter: blur(10px);
    border-radius: 50%;
    transform: translateZ(-2px);
    pointer-events: none;
  }

  /* ========== BOOK ========== */
  #book {
    position: absolute;
    left: 50%; top: 48%;
    width: min(280px, 58vw);
    height: min(380px, 58vh);
    transform: translate(-50%, -50%) translateZ(30px) rotateZ(8deg);
    transform-style: preserve-3d;
    cursor: pointer;
    transition: transform 0.6s var(--ease-out);
    z-index: 5;
  }

  body.zoomed #book {
    transform: translate(-50%, -50%) translateZ(30px) rotateZ(0deg);
    cursor: pointer;
  }

  body.open #book {
    width: min(720px, 94vw);
    height: min(480px, 78vh);
    cursor: default;
    transform: translate(-50%, -50%) translateZ(40px) rotateZ(0deg);
  }

  /* Contact shadow under book */
  .book-shadow {
    position: absolute;
    left: 8%; right: 8%; bottom: -12px;
    height: 28px;
    background: radial-gradient(ellipse, rgba(0,0,0,0.5), transparent 70%);
    filter: blur(8px);
    transform: translateZ(-1px);
    transition: all 0.8s var(--ease);
    pointer-events: none;
  }
  body.open .book-shadow {
    left: 4%; right: 4%; bottom: -18px; height: 36px;
    opacity: 0.7;
  }

  /* Book thickness / block */
  .book-block {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    transition: transform 0.9s var(--ease-out);
  }

  /* Closed cover */
  .cover {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    transform-origin: left center;
    transition: transform 1s var(--ease-out);
    z-index: 10;
    border-radius: 3px 6px 6px 3px;
    background:
      linear-gradient(105deg, rgba(255,220,160,0.08) 0%, transparent 40%),
      linear-gradient(180deg, #5a2822 0%, #3d1814 40%, #2e1210 100%);
    box-shadow:
      2px 0 0 var(--leather-edge),
      4px 0 0 rgba(0,0,0,0.2),
      8px 4px 20px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,220,160,0.12),
      inset -8px 0 16px rgba(0,0,0,0.25);
    backface-visibility: hidden;
  }

  .cover::before {
    content: "";
    position: absolute;
    left: 14px; top: 10%; bottom: 10%;
    width: 3px;
    background: linear-gradient(180deg, transparent, var(--gold), transparent);
    opacity: 0.55;
    border-radius: 2px;
  }

  .cover-title {
    position: absolute;
    left: 0; right: 0; top: 38%;
    text-align: center;
    color: var(--gold);
    font-size: clamp(15px, 3.2vw, 20px);
    letter-spacing: 0.35em;
    font-weight: 400;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    opacity: 0.85;
    pointer-events: none;
    padding-left: 0.35em;
  }

  .cover-subtitle {
    position: absolute;
    left: 0; right: 0; top: 48%;
    text-align: center;
    color: var(--gold);
    font-size: clamp(10px, 2vw, 12px);
    letter-spacing: 0.5em;
    opacity: 0.45;
    pointer-events: none;
    padding-left: 0.5em;
  }

  .cover-ornament {
    position: absolute;
    left: 50%; top: 28%;
    width: 48px; height: 1px;
    transform: translateX(-50%);
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.5;
    pointer-events: none;
  }
  .cover-ornament.bottom { top: auto; bottom: 28%; }

  /* Cover inside (when open) */
  .cover-inside {
    position: absolute; inset: 0;
    transform: rotateY(180deg);
    backface-visibility: hidden;
    border-radius: 6px 3px 3px 6px;
    background:
      linear-gradient(90deg, #e8dcc4 0%, #f0e4cc 8%, #efe2c8 100%);
    box-shadow: inset -4px 0 12px rgba(0,0,0,0.08);
  }

  body.open .cover {
    transform: rotateY(-162deg);
    pointer-events: none;
  }

  /* Page stack edge (closed) */
  .page-edge {
    position: absolute;
    right: -10px; top: 4px; bottom: 4px;
    width: 12px;
    background:
      repeating-linear-gradient(
        180deg,
        #f0e6d0 0px, #e8dcc4 1px, #d9cbb0 2px, #f0e6d0 3px
      );
    transform: translateZ(-2px);
    border-radius: 0 2px 2px 0;
    box-shadow: 2px 0 6px rgba(0,0,0,0.25);
    transition: opacity 0.5s;
  }
  body.open .page-edge { opacity: 0; pointer-events: none; }

  .book-spine {
    position: absolute;
    left: -8px; top: 2px; bottom: 2px;
    width: 10px;
    background: linear-gradient(90deg, #1a0a08, #3a1814 40%, #2a100e);
    transform: rotateY(-90deg) translateZ(0);
    transform-origin: right center;
    border-radius: 2px 0 0 2px;
    box-shadow: -2px 0 8px rgba(0,0,0,0.3);
  }

  /* ========== OPEN INTERIOR ========== */
  #interior {
    position: absolute; inset: 0;
    display: none;
    transform-style: preserve-3d;
    opacity: 0;
    transition: opacity 0.4s ease 0.35s;
  }
  body.open #interior {
    display: flex;
    opacity: 1;
  }

  .spread {
    display: flex;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, #e5d8c0 0%, #f4ead5 8%, #f6ecd8 48%, #eadfc8 52%, #f4ead5 92%, #e5d8c0 100%);
    border-radius: 4px;
    box-shadow:
      0 12px 40px rgba(0,0,0,0.45),
      inset 0 0 0 1px rgba(180,150,100,0.25);
    overflow: hidden;
    position: relative;
  }

  .spread::before {
    content: "";
    position: absolute; inset: 0;
    background:
      url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
    opacity: 0.12;
    pointer-events: none;
    mix-blend-mode: multiply;
    z-index: 1;
  }

  /* Gutter / binding shadow */
  .gutter {
    position: absolute;
    left: 50%; top: 0; bottom: 0;
    width: 28px;
    transform: translateX(-50%);
    background: linear-gradient(90deg,
      transparent,
      rgba(80,50,20,0.08) 30%,
      rgba(40,20,10,0.18) 50%,
      rgba(80,50,20,0.08) 70%,
      transparent);
    z-index: 2;
    pointer-events: none;
  }

  .page {
    flex: 1;
    position: relative;
    min-width: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    z-index: 3;
    padding: clamp(18px, 3.5vw, 36px) clamp(16px, 3vw, 32px) clamp(28px, 4vw, 40px);
  }

  .page.left { padding-right: clamp(20px, 4vw, 40px); }
  .page.right { padding-left: clamp(20px, 4vw, 40px); }

  .page-num {
    position: absolute;
    bottom: 10px;
    font-size: 11px;
    color: var(--hint);
    letter-spacing: 0.1em;
    pointer-events: none;
    user-select: none;
  }
  .page.left .page-num { left: 18px; }
  .page.right .page-num { right: 18px; }

  .page-body {
    flex: 1;
    outline: none;
    overflow-y: auto;
    overflow-x: hidden;
    font-size: clamp(15px, 2.4vw, 17px);
    line-height: 1.85;
    color: var(--ink);
    caret-color: #8b4513;
    word-break: break-word;
    -webkit-overflow-scrolling: touch;
    background-image: repeating-linear-gradient(
      transparent,
      transparent calc(1.85em - 1px),
      var(--paper-line) calc(1.85em - 1px),
      var(--paper-line) 1.85em
    );
    background-attachment: local;
    min-height: 120px;
  }

  .page-body:empty::before,
  .page-body.is-empty::before {
    content: attr(data-placeholder);
    color: var(--hint);
    pointer-events: none;
    font-style: italic;
    opacity: 0.7;
  }

  .page-body ::selection {
    background: rgba(201, 168, 106, 0.35);
  }

  .page-body img.nb-img {
    display: block;
    max-width: 100%;
    height: auto;
    margin: 0.6em auto;
    border-radius: 2px;
    box-shadow: 0 2px 8px rgba(60,40,20,0.18);
    cursor: pointer;
    position: relative;
  }

  .img-wrap {
    position: relative;
    display: block;
    margin: 0.7em auto;
    max-width: 92%;
    width: fit-content;
  }
  .img-wrap img {
    display: block;
    max-width: min(100%, 420px);
    height: auto;
    border-radius: 2px;
    box-shadow: 0 2px 10px rgba(60,40,20,0.2);
  }
  .img-wrap .img-del {
    position: absolute;
    top: -8px; right: -8px;
    width: 22px; height: 22px;
    border-radius: 50%;
    border: none;
    background: rgba(60, 30, 20, 0.85);
    color: #f4ead5;
    font-size: 14px;
    line-height: 22px;
    text-align: center;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s;
    padding: 0;
    font-family: system-ui, sans-serif;
  }
  .img-wrap:hover .img-del,
  .img-wrap:focus-within .img-del {
    opacity: 1;
  }

  /* ========== TOOLBAR ========== */
  #toolbar {
    position: fixed;
    left: 50%;
    bottom: max(16px, env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(120%);
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 8px 12px;
    background: rgba(42, 28, 20, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 999px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.4);
    z-index: 100;
    transition: transform 0.5s var(--ease-out) 0.2s;
    border: 1px solid rgba(201,168,106,0.2);
  }
  body.open #toolbar {
    transform: translateX(-50%) translateY(0);
  }

  #toolbar button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ui);
    font-family: "Songti SC", "Noto Serif SC", Georgia, serif;
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: background 0.2s, color 0.2s;
    white-space: nowrap;
  }
  #toolbar button:hover,
  #toolbar button:focus-visible {
    background: rgba(201,168,106,0.22);
    outline: none;
  }
  #toolbar button:active { background: rgba(201,168,106,0.35); }
  #toolbar button:disabled {
    opacity: 0.35;
    cursor: default;
  }
  #toolbar .sep {
    width: 1px; height: 18px;
    background: rgba(201,168,106,0.25);
  }
  #page-indicator {
    color: rgba(247,239,227,0.7);
    font-size: 12px;
    letter-spacing: 0.08em;
    min-width: 4.5em;
    text-align: center;
    font-variant-numeric: tabular-nums;
    user-select: none;
  }

  /* Hint overlay for first visit */
  #hint-toast {
    position: fixed;
    top: max(20px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    background: rgba(42,28,20,0.8);
    color: var(--ui);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    letter-spacing: 0.08em;
    z-index: 90;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s;
    border: 1px solid rgba(201,168,106,0.2);
  }
  #hint-toast.show { opacity: 1; }

  /* Drag-over highlight */
  .page.drag-over .page-body {
    outline: 2px dashed rgba(201,168,106,0.6);
    outline-offset: -4px;
    background-color: rgba(201,168,106,0.08);
  }

  /* Mobile: single page */
  @media (max-width: 640px) {
    body.open #book {
      width: min(100vw - 16px, 420px);
      height: min(78vh, 640px);
    }
    .page.left-hidden-mobile { display: none; }
    .gutter { display: none; }
    .spread {
      background: linear-gradient(90deg, #e8dcc4 0%, #f4ead5 6%, #f4ead5 94%, #e8dcc4 100%);
    }
    .page.right { padding-left: clamp(16px, 4vw, 28px); padding-right: clamp(16px, 4vw, 28px); }
    #toolbar {
      flex-wrap: wrap;
      justify-content: center;
      max-width: calc(100vw - 16px);
      border-radius: 16px;
      gap: 4px;
      padding: 6px 8px;
    }
    #toolbar button { padding: 7px 10px; font-size: 12px; }
  }

  /* Reduce motion */
  @media (prefers-reduced-motion: reduce) {
    #world, #book, .cover, #toolbar, #interior { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div id="scene">
  <div id="world">
    <div id="desk" title="点击桌面放下书"></div>
    <div id="book" role="button" aria-label="手札">
      <div class="book-shadow"></div>
      <div class="book-spine"></div>
      <div class="page-edge"></div>
      <div class="book-block">
        <div class="cover">
          <div class="cover-ornament"></div>
          <div class="cover-title">手 札</div>
          <div class="cover-subtitle">NOTEBOOK</div>
          <div class="cover-ornament bottom"></div>
          <div class="cover-inside"></div>
        </div>
        <div id="interior">
          <div class="spread">
            <div class="gutter"></div>
            <div class="page left" data-side="left">
              <div class="page-body" contenteditable="true" spellcheck="false" data-placeholder="点这里开始写…"></div>
              <div class="page-num"></div>
            </div>
            <div class="page right" data-side="right">
              <div class="page-body" contenteditable="true" spellcheck="false" data-placeholder="点这里开始写…"></div>
              <div class="page-num"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="hint-toast"></div>

<div id="toolbar" role="toolbar" aria-label="手札工具">
  <button type="button" id="btn-prev" title="上一页">‹ 上一页</button>
  <span id="page-indicator">1 / 1</span>
  <button type="button" id="btn-next" title="下一页">下一页 ›</button>
  <span class="sep"></span>
  <button type="button" id="btn-new" title="新建一页">新建一页</button>
  <button type="button" id="btn-img" title="插入图片">插入图片</button>
  <span class="sep"></span>
  <button type="button" id="btn-close" title="合上书">合上书</button>
  <button type="button" id="btn-desk" title="放下">放下</button>
</div>

<input type="file" id="file-input" accept="image/*" multiple hidden />

<script>
(function () {
  "use strict";

  const STORAGE_KEY = "wooden-notebook-v1";
  const MAX_IMG_EDGE = 1200;
  const JPEG_QUALITY = 0.82;

  const body = document.body;
  const book = document.getElementById("book");
  const desk = document.getElementById("desk");
  const toast = document.getElementById("hint-toast");
  const fileInput = document.getElementById("file-input");
  const pageIndicator = document.getElementById("page-indicator");
  const leftPage = document.querySelector(".page.left");
  const rightPage = document.querySelector(".page.right");
  const leftBody = leftPage.querySelector(".page-body");
  const rightBody = rightPage.querySelector(".page-body");
  const leftNum = leftPage.querySelector(".page-num");
  const rightNum = rightPage.querySelector(".page-num");

  /** @type {{html:string}[]} */
  let pages = [{ html: "" }, { html: "" }];
  let spreadIndex = 0; // which left-page index (even)
  let animating = false;
  let state = "desk"; // desk | zoomed | open
  let saveTimer = null;
  let activeSide = "right"; // which page last focused for image insert
  let toastTimer = null;

  function isMobile() {
    return window.matchMedia("(max-width: 640px)").matches;
  }

  function showToast(msg, ms) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toast.classList.remove("show");
    }, ms || 2400);
  }

  function stripScripts(html) {
    var d = document.createElement("div");
    d.innerHTML = html;
    d.querySelectorAll("script, iframe, object, embed, link[rel=import]").forEach(function (el) {
      el.remove();
    });
    d.querySelectorAll("*").forEach(function (el) {
      Array.from(el.attributes).forEach(function (attr) {
        if (/^on/i.test(attr.name)) el.removeAttribute(attr.name);
        if (attr.name === "href" && /^\s*javascript:/i.test(attr.value)) el.removeAttribute("href");
        if (attr.name === "src" && /^\s*javascript:/i.test(attr.value)) el.removeAttribute("src");
      });
    });
    return d.innerHTML;
  }

  function isBodyEmpty(el) {
    var t = (el.textContent || "").replace(/\u200b/g, "").trim();
    if (t.length) return false;
    if (el.querySelector("img, .img-wrap")) return false;
    return true;
  }

  function updateEmptyClass(el) {
    if (isBodyEmpty(el)) el.classList.add("is-empty");
    else el.classList.remove("is-empty");
  }

  function ensurePages() {
    while (pages.length < 2) pages.push({ html: "" });
    if (pages.length % 2 === 1) pages.push({ html: "" });
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (data && Array.isArray(data.pages) && data.pages.length) {
        pages = data.pages.map(function (p) {
          return { html: stripScripts(typeof p === "string" ? p : (p.html || "")) };
        });
        spreadIndex = Math.max(0, Math.min(data.spreadIndex || 0, pages.length - 1));
        if (spreadIndex % 2 === 1) spreadIndex -= 1;
      }
    } catch (e) {
      console.warn("load failed", e);
    }
    ensurePages();
  }

  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, 280);
  }

  function persist() {
    syncFromDOM();
    try {
      var payload = {
        pages: pages.map(function (p) { return { html: stripScripts(p.html) }; }),
        spreadIndex: spreadIndex,
        savedAt: Date.now()
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    } catch (e) {
      showToast("存储空间不足，部分内容可能未保存");
      console.warn(e);
    }
  }

  function syncFromDOM() {
    ensurePages();
    if (isMobile()) {
      var idx = spreadIndex;
      if (idx < pages.length) pages[idx].html = stripScripts(rightBody.innerHTML);
    } else {
      if (spreadIndex < pages.length) pages[spreadIndex].html = stripScripts(leftBody.innerHTML);
      if (spreadIndex + 1 < pages.length) pages[spreadIndex + 1].html = stripScripts(rightBody.innerHTML);
    }
  }

  function renderSpread() {
    ensurePages();
    var mobile = isMobile();

    if (mobile) {
      leftPage.classList.add("left-hidden-mobile");
      leftPage.style.display = "none";
      var idx = spreadIndex;
      rightBody.innerHTML = pages[idx] ? pages[idx].html : "";
      rightNum.textContent = String(idx + 1);
      leftBody.innerHTML = "";
      bindImageDeletes(rightBody);
      updateEmptyClass(rightBody);
      pageIndicator.textContent = (idx + 1) + " / " + pages.length;
    } else {
      leftPage.classList.remove("left-hidden-mobile");
      leftPage.style.display = "";
      var li = spreadIndex;
      var ri = spreadIndex + 1;
      leftBody.innerHTML = pages[li] ? pages[li].html : "";
      rightBody.innerHTML = pages[ri] ? pages[ri].html : "";
      leftNum.textContent = String(li + 1);
      rightNum.textContent = String(ri + 1);
      bindImageDeletes(leftBody);
      bindImageDeletes(rightBody);
      updateEmptyClass(leftBody);
      updateEmptyClass(rightBody);
      pageIndicator.textContent = (li + 1) + "–" + (ri + 1) + " / " + pages.length;
    }

    document.getElementById("btn-prev").disabled = spreadIndex <= 0;
    var atEnd = mobile
      ? spreadIndex >= pages.length - 1
      : spreadIndex + 2 >= pages.length;
    // next is never fully disabled — going past last creates pages
    document.getElementById("btn-next").disabled = false;
  }

  function bindImageDeletes(container) {
    container.querySelectorAll(".img-wrap").forEach(function (wrap) {
      var btn = wrap.querySelector(".img-del");
      if (!btn) {
        btn = document.createElement("button");
        btn.type = "button";
        btn.className = "img-del";
        btn.setAttribute("aria-label", "删除图片");
        btn.textContent = "×";
        wrap.appendChild(btn);
      }
      btn.onclick = function (e) {
        e.preventDefault();
        e.stopPropagation();
        wrap.remove();
        updateEmptyClass(container);
        scheduleSave();
      };
    });
  }

  function goPrev() {
    if (animating || state !== "open") return;
    syncFromDOM();
    if (spreadIndex <= 0) return;
    if (isMobile()) spreadIndex -= 1;
    else spreadIndex = Math.max(0, spreadIndex - 2);
    renderSpread();
    scheduleSave();
  }

  function goNext() {
    if (animating || state !== "open") return;
    syncFromDOM();
    if (isMobile()) {
      if (spreadIndex >= pages.length - 1) {
        pages.push({ html: "" });
      }
      spreadIndex += 1;
    } else {
      if (spreadIndex + 2 >= pages.length) {
        pages.push({ html: "" }, { html: "" });
      }
      spreadIndex += 2;
    }
    renderSpread();
    scheduleSave();
  }

  function newPage() {
    if (state !== "open") return;
    syncFromDOM();
    if (isMobile()) {
      pages.splice(spreadIndex + 1, 0, { html: "" });
      spreadIndex += 1;
    } else {
      // insert a new spread after current
      var insertAt = spreadIndex + 2;
      pages.splice(insertAt, 0, { html: "" }, { html: "" });
      spreadIndex = insertAt;
    }
    ensurePages();
    renderSpread();
    scheduleSave();
    showToast("已新建一页");
    setTimeout(function () {
      var el = isMobile() ? rightBody : leftBody;
      el.focus();
    }, 50);
  }

  function zoomIn() {
    if (animating || state !== "desk") return;
    animating = true;
    state = "zoomed";
    body.classList.add("zoomed");
    showToast("再点一下打开手札");
    setTimeout(function () { animating = false; }, 1300);
  }

  function openBook() {
    if (animating || state !== "zoomed") return;
    animating = true;
    state = "open";
    body.classList.add("open");
    renderSpread();
    setTimeout(function () {
      animating = false;
      showToast("可以开始书写了");
    }, 1000);
  }

  function closeBook(thenDesk) {
    if (animating || state === "desk") return;
    syncFromDOM();
    persist();
    animating = true;
    if (state === "open") {
      body.classList.remove("open");
      state = "zoomed";
      setTimeout(function () {
        if (thenDesk) {
          body.classList.remove("zoomed");
          state = "desk";
          setTimeout(function () { animating = false; }, 1250);
        } else {
          animating = false;
        }
      }, 900);
    } else if (state === "zoomed") {
      body.classList.remove("zoomed");
      state = "desk";
      setTimeout(function () { animating = false; }, 1250);
    }
  }

  function putDown() {
    closeBook(true);
  }

  // --- Image handling ---
  function compressImage(file) {
    return new Promise(function (resolve, reject) {
      if (!file || !/^image\//.test(file.type)) {
        reject(new Error("not image"));
        return;
      }
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        var w = img.naturalWidth;
        var h = img.naturalHeight;
        var scale = 1;
        if (Math.max(w, h) > MAX_IMG_EDGE) {
          scale = MAX_IMG_EDGE / Math.max(w, h);
        }
        var cw = Math.round(w * scale);
        var ch = Math.round(h * scale);
        var canvas = document.createElement("canvas");
        canvas.width = cw;
        canvas.height = ch;
        var ctx = canvas.getContext("2d");
        ctx.fillStyle = "#f4ead5";
        ctx.fillRect(0, 0, cw, ch);
        ctx.drawImage(img, 0, 0, cw, ch);
        var outType = /png|webp|gif/i.test(file.type) && file.type !== "image/gif" ? "image/jpeg" : "image/jpeg";
        try {
          resolve(canvas.toDataURL("image/jpeg", JPEG_QUALITY));
        } catch (e) {
          reject(e);
        }
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error("load fail"));
      };
      img.src = url;
    });
  }

  function insertDataUrl(dataUrl, targetBody) {
    var wrap = document.createElement("div");
    wrap.className = "img-wrap";
    wrap.contentEditable = "false";
    var img = document.createElement("img");
    img.src = dataUrl;
    img.alt = "插图";
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "img-del";
    btn.setAttribute("aria-label", "删除图片");
    btn.textContent = "×";
    btn.onclick = function (e) {
      e.preventDefault();
      e.stopPropagation();
      wrap.remove();
      updateEmptyClass(targetBody);
      scheduleSave();
    };
    wrap.appendChild(img);
    wrap.appendChild(btn);

    // insert at caret if possible, else append
    var sel = window.getSelection();
    var inserted = false;
    if (sel && sel.rangeCount && targetBody.contains(sel.anchorNode)) {
      try {
        var range = sel.getRangeAt(0);
        range.collapse(false);
        range.insertNode(wrap);
        var br = document.createElement("br");
        wrap.after(br);
        range.setStartAfter(br);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
        inserted = true;
      } catch (e) { /* fall through */ }
    }
    if (!inserted) {
      targetBody.appendChild(wrap);
      targetBody.appendChild(document.createElement("br"));
    }
    updateEmptyClass(targetBody);
    scheduleSave();
  }

  async function handleFiles(fileList, targetBody) {
    var files = Array.from(fileList || []);
    for (var i = 0; i < files.length; i++) {
      try {
        var dataUrl = await compressImage(files[i]);
        insertDataUrl(dataUrl, targetBody);
      } catch (e) {
        showToast("图片处理失败");
      }
    }
  }

  function getActiveBody() {
    if (isMobile()) return rightBody;
    return activeSide === "left" ? leftBody : rightBody;
  }

  // --- Events ---
  book.addEventListener("click", function (e) {
    if (state === "open") {
      // don't close when clicking inside pages
      return;
    }
    e.stopPropagation();
    if (state === "desk") zoomIn();
    else if (state === "zoomed") openBook();
  });

  desk.addEventListener("click", function (e) {
    if (state === "desk") return;
    e.stopPropagation();
    if (state === "open" || state === "zoomed") putDown();
  });

  // Prevent desk click when interacting with toolbar
  document.getElementById("toolbar").addEventListener("click", function (e) {
    e.stopPropagation();
  });

  leftBody.addEventListener("focus", function () { activeSide = "left"; });
  rightBody.addEventListener("focus", function () { activeSide = "right"; });

  [leftBody, rightBody].forEach(function (el) {
    el.addEventListener("input", function () {
      updateEmptyClass(el);
      scheduleSave();
    });
    el.addEventListener("blur", function () {
      scheduleSave();
    });
    // drag and drop
    el.addEventListener("dragover", function (e) {
      e.preventDefault();
      el.closest(".page").classList.add("drag-over");
    });
    el.addEventListener("dragleave", function () {
      el.closest(".page").classList.remove("drag-over");
    });
    el.addEventListener("drop", function (e) {
      e.preventDefault();
      e.stopPropagation();
      el.closest(".page").classList.remove("drag-over");
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
        handleFiles(e.dataTransfer.files, el);
      }
    });
  });

  // Touch swipe for page turn
  var touchStartX = 0;
  var touchStartY = 0;
  document.getElementById("interior").addEventListener("touchstart", function (e) {
    if (!e.touches[0]) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  document.getElementById("interior").addEventListener("touchend", function (e) {
    if (!e.changedTouches[0]) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    var dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
    // don't swipe-turn if user was selecting text inside contenteditable with long press — rough heuristic
    if (state !== "open") return;
    if (dx < 0) goNext();
    else goPrev();
  }, { passive: true });

  document.getElementById("btn-prev").addEventListener("click", goPrev);
  document.getElementById("btn-next").addEventListener("click", goNext);
  document.getElementById("btn-new").addEventListener("click", newPage);
  document.getElementById("btn-close").addEventListener("click", function () {
    closeBook(false);
  });
  document.getElementById("btn-desk").addEventListener("click", putDown);
  document.getElementById("btn-img").addEventListener("click", function () {
    if (state !== "open") return;
    fileInput.click();
  });
  fileInput.addEventListener("change", function () {
    var target = getActiveBody();
    handleFiles(fileInput.files, target).then(function () {
      fileInput.value = "";
    });
  });

  // Keyboard shortcuts when open
  document.addEventListener("keydown", function (e) {
    if (state !== "open") return;
    if (e.target && (e.target.isContentEditable || e.target.closest && e.target.closest("[contenteditable]"))) {
      if (e.key === "Escape") {
        e.preventDefault();
        closeBook(false);
      }
      return;
    }
    if (e.key === "ArrowLeft") goPrev();
    if (e.key === "ArrowRight") goNext();
    if (e.key === "Escape") closeBook(false);
  });

  window.addEventListener("resize", function () {
    if (state === "open") {
      syncFromDOM();
      renderSpread();
    }
  });

  window.addEventListener("beforeunload", function () {
    syncFromDOM();
    persist();
  });

  // Init
  load();
  // start on desk
  showToast("点击桌上的书靠近", 3200);

  // Expose for debug
  window.__notebook = {
    persist: persist,
    pages: function () { return pages; },
    state: function () { return state; }
  };
})();
</script>
</body>
</html>
